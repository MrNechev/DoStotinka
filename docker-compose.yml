# Slavotax – self-hosted budget & money manager
#
# Quick start:
#   cp .env.example .env      # then edit DB_PASSWORD
#   docker compose up -d
# Open http://<your-server>:3000
name: slavotax

services:
  slavotax:
    image: ghcr.io/mrnechev/slavotax:${SLAVOTAX_VERSION:-latest}
    container_name: slavotax
    restart: unless-stopped
    ports:
      - "${SLAVOTAX_PORT:-3000}:3000"
    # Every setting from .env reaches the app (see the README); the values below take precedence.
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container (the published port is SLAVOTAX_PORT).
      PORT: "3000"
      NODE_ENV: production
      DB_HOST: database
      DB_USERNAME: ${DB_USERNAME:-slavotax}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-slavotax}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      EXCHANGE_RATES_AUTO_UPDATE: ${EXCHANGE_RATES_AUTO_UPDATE:-true}
      TZ: ${TZ:-UTC}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    container_name: slavotax_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-slavotax}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      POSTGRES_DB: ${DB_DATABASE_NAME:-slavotax}
    volumes:
      - ${DB_DATA_LOCATION:-./postgres}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional nightly database backups (compressed SQL dumps, kept for BACKUP_KEEP_DAYS days).
  # Enable with:  docker compose --profile backup up -d
  backup:
    image: postgres:18-alpine
    container_name: slavotax_backup
    restart: unless-stopped
    profiles: ["backup"]
    environment:
      PGHOST: database
      PGUSER: ${DB_USERNAME:-slavotax}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      PGDATABASE: ${DB_DATABASE_NAME:-slavotax}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_LOCATION:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 300  # first backup a few minutes after start-up (after migrations)
        while true; do
          name="slavotax-$$(date +%Y-%m-%d_%H%M).sql.gz"
          if pg_dump --clean --if-exists | gzip > /backups/.partial; then
            mv /backups/.partial "/backups/$$name" && echo "Backup written: $$name"
          else
            echo "Backup failed" >&2
          fi
          find /backups -name 'slavotax-*.sql.gz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done
    depends_on:
      database:
        condition: service_healthy

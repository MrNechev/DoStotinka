name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slavotax
          POSTGRES_PASSWORD: slavotax
          POSTGRES_DB: slavotax_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slavotax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slavotax:slavotax@localhost:5432/slavotax_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: slavotax
          POSTGRES_PASSWORD: slavotax
          POSTGRES_DB: slavotax
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U slavotax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Start the server
        run: |
          node apps/server/dist/index.js > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
        env:
          DATABASE_URL: postgres://slavotax:slavotax@localhost:5432/slavotax
          WEB_DIST: apps/web/dist
          DEMO_ENABLED: "true"
          EXCHANGE_RATES_AUTO_UPDATE: "false"
          RATE_LIMIT_AUTH_PER_MINUTE: "1000"
      - run: pnpm --filter @slavotax/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @slavotax/e2e test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            tests/e2e/test-results
            server.log
          retention-days: 7

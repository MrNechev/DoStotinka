name: Android app

# Builds and lints the Android app (apps/android). For version tags it also builds the signed
# release APK and attaches it to the GitHub release – when the signing key is configured as
# repository secrets (see apps/android/README.md).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build the debug app and run Android lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug lintDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # Make the reason visible as annotations (readable without downloading the logs).
            grep -vE "^> Task" "$RUNNER_TEMP/gradle.log" |
              grep -iE "^e: |error:|warning:|what went wrong|lint found|failed|exception" | head -9 |
              while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dostotinka-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-lint-report
          path: apps/android/app/build/reports/

  release:
    name: Signed release APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: No signing key configured
        if: env.HAS_KEY != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set – no APK is attached to this release."
      - name: Use Java 21
        if: env.HAS_KEY == 'true'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build the signed release
        if: env.HAS_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/dostotinka-${GITHUB_REF_NAME#v}.apk"
          rm "$RUNNER_TEMP/release.jks"
      - name: Attach the APK to the release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created by the "Release" workflow at the same time – wait for it.
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/dostotinka-${GITHUB_REF_NAME#v}.apk" --clobber

name: Release

# Publishes a GitHub release with the notes from CHANGELOG.md when a version tag (v1.2.3) is
# pushed. The Docker image for the tag is built by the "Docker image" workflow.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Docker image"
            echo
            echo '```'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dostotinka:${version}"
            echo '```'
            echo
            echo "Installation and upgrade instructions: see the [README](https://github.com/${GITHUB_REPOSITORY}#installation)."
          } >> notes.md
          if [ ! -s notes.md ]; then echo "No changelog section for $version"; exit 1; fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "DoStotinka ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

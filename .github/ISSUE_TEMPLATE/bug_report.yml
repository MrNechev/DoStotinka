name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DoStotinka version
      description: Shown at the bottom of the Settings page.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      description: Output of `docker compose logs dostotinka` around the time of the problem.
      render: shell

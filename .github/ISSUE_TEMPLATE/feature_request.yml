name: Feature request
description: Suggest an idea for DoStotinka
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
